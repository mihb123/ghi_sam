[project]
name = "ghibai"
version = "0.1.0"
description = "Bot Telegram ghi diem 3 cay: luu SQLite, export Google Sheet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.6",
    "gspread>=6.1.2",
    "google-auth>=2.35.0",
    "python-dotenv>=1.0.1",
    "aiohttp>=3.10",
]

[project.scripts]
ghibai = "ghibai.bot:main"
ghibai-zalo = "ghibai.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghibai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# /app trong image thuoc uid khac uid chay container nen pytest khong ghi cache vao do duoc
cache_dir = "/tmp/.pytest_cache_ghibai"
